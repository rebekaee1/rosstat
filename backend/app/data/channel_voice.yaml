# Словарь автора Telegram-канала (ADR-0035): какими словами он пишет и чего не пишет.
#
# Это согласуется с владельцем по показу (.artifacts/telegram-author-2026-11-17/просмотр.html): он отмечает
# по настоящим постам «это слово — да, это — нет». Его ответы приходят в служебный бот командой /voice и хранятся
# в базе (таблица channel_voice_rules); они дополняют этот файл и важнее его. Оба списка попадают в системный
# промпт автора (раздел words), а список «не пишем» ещё и проверяет сторож: пост с таким словом возвращается автору.
#
# Разделы use: по одному правилу в строке, с примером из настоящего поста. Правила — про слова, не про смысл.

use:
  start:      # как пост начинается
    - "Первая строка — что случилось, полным предложением с числом: «АИ-92 подешевел до 70,01 ₽ за литр — пятая неделя снижения подряд»."
    - "Заголовок не начинается с названия рубрики, с вопроса и со слов «Внимание», «Важно», «Срочно»."
  number:     # как называется число
    - "Число пишется полностью, как в источнике: «70,01 ₽ за литр», «6,35 %», «10 222,10 ₽ за грамм»; в заголовке можно округлить до рубля."
    - "У числа всегда есть дата или период: «на 9 ноября», «за сентябрь»."
    - "Единицы словами и знаками, понятными без пояснений: «₽ за литр», «₽ за грамм», «$ за баррель», «% за год»."
  change:     # как сказано об изменении
    - "Глаголом: «подешевел», «подорожал», «вырос», «снизился», «не изменился» — и на сколько: «за неделю −1,0 %»."
    - "Изменение ставок и инфляции — в пунктах: «на 0,01 пункта», «−2,50 пункта»."
    - "Серии — словами: «пятая неделя снижения подряд», «впервые с начала сентября»."
  compare:    # с чем сравниваем
    - "С прошлым значением и с годом назад: «в августе было 6,34 %, год назад — 7,99 %»."
    - "В вещах, которые можно потрогать: «бак на 50 литров — 3 501 ₽», «что год назад стоило 1 000 ₽, сейчас стоит 1 064 ₽»."
  forecast:   # о прогнозе
    - "Одно число и слова «наш расчёт»: «Наш расчёт: 6,26 %»."
    - "Дата следующей цифры: «Цифра за октябрь — 25 ноября»."
  source:     # об источнике
    - "Источник — отдельной последней строкой: «Источник: Росстат», рядом ссылка «График и все годы». Её ставит программа."
    - "Если в тексте нужна дата данных, источник называется по имени: «Это цены Росстата на 9 ноября»."
  ending:     # чем пост заканчивается
    - "Наблюдением или тем, что будет дальше, — без призывов и без вопроса к читателю."

ban:          # чего автор не пишет никогда
  - "г/г"
  - "м/м"
  - "п. п."
  - "п.п."
  - "б.п."
  - "ИПЦ"
  - "ИЦП"
  - "волатильность"
  - "базисный пункт"
  - "дефлятор"
  - "сезонно скорректированный"
  - "стоит отметить"
  - "следует отметить"
  - "важно понимать"
  - "как известно"
  - "эксперты считают"
  - "аналитики ожидают"
  - "не является инвестиционной рекомендацией"
  - "подписывайтесь"
  - "ставьте лайк"
  - "шок"
  - "сенсация"
  - "обвал"
  - "рухнул"
  - "взлетел"
