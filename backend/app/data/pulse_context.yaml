# Контекст проекта для аналитика Пульса (services/pulse_context.py). Что произошло и чего ждать в цифрах — чтобы
# модель не называла обвалом фильтр роботов и не плодила гипотезы о том, что объяснено решением.
# Пишет агент вместе с правкой, которая меняет счёт метрик, трафик, данные или отчёты (docs/knowledge-workflow.md).
# Поля: id (латиница, для ссылок в гипотезах), date (событие, ГГГГ-ММ-ДД), kind, title, expect (что ждать в цифрах),
# until (после этой даты не показывать), commit (короткий SHA правки: дата выпуска берётся из журнала выпусков).
# Без почт, телефонов, IP, ключей и имён людей. Запись не длиннее 300 знаков вместе с заголовком.
entries:
  - id: mail-launch
    date: 2026-11-14
    kind: новый канал
    title: "Почта сайта (ADR-0032): письма подтверждения адреса, сброса пароля, рассылка; пока выключено."
    expect: После включения переходы из писем идут каналом campaign (utm_source=email, utm_medium=newsletter); всплеск визитов в день выпуска — рассылка, не робот.
    until: 2027-03-31
    commit: 7a6fac5a
  - id: bot-filter-google-farm
    date: 2026-11-14
    kind: смена счёта метрик
    title: Ферма с Referer google.com (Chrome Linux, 640 «ядер») больше не считается людьми; поисковики, аудитория и гео в BI — без роботов.
    expect: Google-переходы в нашем счётчике упадут с ~1800 до ~20 в сутки (Метрика 7–13), «люди» 13–14.11 −35–40 % после пересчёта. Это фильтр, не обвал.
    until: 2027-01-31
    commit: a5d71940
  - id: bot-score-google-linux-us
    date: 2026-11-14
    kind: смена счёта метрик
    title: Новый признак робота — Referer ровно google.com + Linux + американский пояс (добавка 40 баллов, не приговор).
    expect: Доля ботов в BI немного вырастет, Google-переходов станет меньше; у людей с любым вводом мышью/касанием счёт не меняется.
    until: 2027-01-31
    commit: 04ea729d
  - id: nginx-gfarm-budget
    date: 2026-11-14
    kind: защита от роботов
    title: Ферма с подставленным Referer Google получает свой общий бюджет 2 зап/с в nginx (класс gfarm), люди без Referer не затронуты.
    expect: Больше ответов 429 у фермы, меньше нагрузки на рендер; в сводке роботов отдельная строка gfarm.
    until: 2027-01-31
    commit: 0bb13334
  - id: pass-bind-observe
    date: 2026-11-14
    kind: эксперимент
    title: Привязка пропуска «подождите» к сети и браузеру — пока только наблюдение (FE_PASS_BIND=observe), журнал pass-observe.log.
    expect: Решение о включении через 2–3 суток после выпуска, если «не совпало бы» у людей < 1 %. Поведение сайта не меняется.
    until: 2026-12-31
    commit: e2b1ff09
  - id: pass-mint-net-limit
    date: 2026-11-14
    kind: защита от роботов
    title: Выдача пропуска — 3 в минуту на сеть клиента, общий потолок 20 в секунду (был 5).
    expect: У фермы с JS меньше пропусков из одной сети; у людей без изменений.
    until: 2027-01-31
    commit: 6ef8b44c
  - id: morning-summary-humans-429
    date: 2026-11-14
    kind: отчёты
    title: В утренней сводке 09:10 появились строки о роботах и о людях с отказом «подождите» (прошли по пропуску или нет).
    expect: Новая строка, а не новая проблема; человек там — браузер с cookie Метрики.
    until: 2026-12-31
    commit: 64347427
  - id: counter-mismatch-line
    date: 2026-11-14
    kind: отчёты
    title: Сверка переходов из поисковиков с Метрикой — строка в сводке при расхождении в 3+ раза и ≥ 30 визитах.
    expect: Появится, если роботы снова прорвутся в счётчик; одна заметка в день.
    until: 2026-12-31
    commit: ac917de3
  - id: pulse-etl-count
    date: 2026-11-14
    kind: смена счёта метрик
    title: «Упавших ETL» в Пульсе было обрезано до 20 и смешивало наши ошибки с недоступностью источника.
    expect: Теперь «наших ошибок» ≈ 0, «источник недоступен» 25–31; etl_failed в памяти — полное число. Скачок etl_failed — смена счёта, не авария.
    until: 2026-12-31
    commit: ac8488f4
  - id: weekly-cpi-segments
    date: 2026-11-14
    kind: данные
    title: Сегменты недельного ИПЦ (продукты, непрод., услуги) больше не помечаются «источник недоступен» — их данные в порядке.
    expect: «Источник недоступен» уменьшится на 3 ряда.
    until: 2026-12-31
    commit: ede84a4a
  - id: rosstat-partial-outage
    date: 2026-11-11
    kind: авария источника
    title: Росстат восстановлен частично — цены живы, промышленность, демография, наука, пенсионеры и часть счетов отдают 404.
    expect: 25–31 ряд в «источник недоступен» каждый день, пока Росстат не вернёт файлы; данные догрузятся сами. Не наша ошибка.
    until: 2026-12-31
  - id: minfin-blocks-timeweb
    date: 2026-10-08
    kind: авария источника
    title: Минфин режет сети нашего хостинга — бюджет (budget-*) идёт из снимка, который владелец обновляет с Mac.
    expect: Жёлтая строка «запасной источник» каждый день — норма; данные обновляются примерно раз в месяц.
    until: 2027-03-31
  - id: openrouter-topup
    date: 2026-11-14
    kind: сервис
    title: Счёт OpenRouter пополнен владельцем 14.11; при малом остатке Пульс повторяет запрос с лимитом по остатку и пишет причину.
    expect: «LLM-аналитик недоступен» 14.11 — из-за денег на счёте, не из-за кода.
    until: 2026-12-31
    commit: 79f357fa
  - id: adr-0029-0030-ru-google
    date: 2026-11-11
    kind: эксперимент
    title: ru. для Google — короткий sitemap и noindex годовых страниц мира (ADR-0029/0030), база 13.11.
    expect: Замеры 25.11 и 23.12 — показы и клики Google по ru.; эффект медленный (недели), краткие колебания не вывод.
    until: 2027-01-15
  - id: adr-0031-apex-google
    date: 2026-11-14
    kind: эксперимент
    title: Английский хост для Google — короткий sitemap и noindex годовых страниц без спроса (ADR-0031), по команде владельца.
    expect: После выпуска показы Google по годовым без спроса уйдут; страницы со спросом остаются. Оценка — замеры 25.11 и 23.12.
    until: 2027-01-15
  - id: sessionize-incremental
    date: 2026-11-14
    kind: инфраструктура
    title: Инкрементная сессионизация каждые 15 минут — за флагом analytics_sessionize_incremental_enabled, полный прогон раз в час.
    expect: Числа сессий не меняются (сверка 0 расхождений); меньше нагрузки на базу.
    until: 2026-12-31
    commit: c4e8dbfb
