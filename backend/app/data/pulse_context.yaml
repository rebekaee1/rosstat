# Контекст проекта для аналитика Пульса (services/pulse_context.py). Что произошло и чего ждать в цифрах — чтобы
# модель не называла обвалом фильтр роботов и не плодила гипотезы о том, что объяснено решением.
# Пишет агент вместе с правкой, которая меняет счёт метрик, трафик, данные или отчёты (docs/knowledge-workflow.md).
# Поля: id (латиница, для ссылок в гипотезах), date (событие, ГГГГ-ММ-ДД), kind, title, expect (что ждать в цифрах),
# until (после этой даты не показывать), commit (короткий SHA правки: дата выпуска берётся из журнала выпусков).
# Без почт, телефонов, IP, ключей и имён людей. Запись не длиннее 300 знаков вместе с заголовком.
entries:
