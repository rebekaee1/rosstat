    expect: "Клики по canvas «Земля» больше не считаются dead; за 30 дней до правки их было 73 от 14 человек — падение до нуля означает смену учёта, не уход людей с шара. Rage по кнопке «Приблизить Землю» 16–20.10 давали в основном сессии симуляторов (iOS 18.7, 414x896, канал internal, одна сессия) и сам сайт; посторонний человек с rage — один (20.10). Клики по странам без страницы на плоской карте (path.outline-none в planet-map-plate) с этого же выпуска открывают карточку «Данных пока нет» и тоже не считаются dead (было 25 кликов от 12 человек за 30 дней). Клики в океан по самому svg остаются dead — там отклика нет. Кнопки «+» и «−» у предела масштаба теперь выключены: нажатия по ним у предела не записываются."
