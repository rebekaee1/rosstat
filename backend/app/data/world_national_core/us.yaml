# United States national-core passport (official FRED CSV + optional BLS/BEA APIs).
# Live-probed 2026-09-20 via FRED keyless graph CSV (fred.stlouisfed.org/graph/fredgraph.csv).
# Loader: backend/scripts/load-world-national.py --country us
# 59 curated series (9 original + 50 added). Passport rows use fred so ingest
# works without API keys. Loader is idempotent and does not touch existing
# eurostat/IMF rows for US. Case-Shiller, equity indexes, UMich sentiment and
# ICE HY skipped (licence). Daily twins prefer monthly (GS10 not DGS10).
# Population: existing `us-population-census` (Census PEP, annual) — POPTHM
# not added to avoid a second population card.

country_code: US

series:
  - code_suffix: cpi-all
    name_ru: Индекс потребительских цен
    name_en: Consumer Price Index (all urban consumers)
    category_ru: Цены
    unit: INDEX
    unit_ru: индекс (1982–84 = 100)
    frequency: monthly
    aggregation: mean
    provider: fred
    dataset_id: "CPIAUCSL"
    series_id: "CPIAUCSL"
    source_url: "https://fred.stlouisfed.org/series/CPIAUCSL"
    analog_ru: ИПЦ
    is_listed: true
    description: >
      Индекс потребительских цен США для всех городских потребителей по всем
      товарам и услугам корзины, с сезонной корректировкой. Показывает, как
      меняется стоимость фиксированного набора товаров и услуг относительно
      базового периода.
    methodology: >
      Ряд публикует Федеральный резервный банк Сент-Луиса по данным Бюро
      трудовой статистики США. Частота публикации — месячная. Единица
      измерения на графике — индекс (1982–84 = 100). На графике — официальный
      сезонно скорректированный национальный ряд без дополнительных
      преобразований.

