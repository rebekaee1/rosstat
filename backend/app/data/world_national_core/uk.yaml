      населения в общей численности соответствующей возрастной группы.
    methodology: >
      Ряд публикует Управление национальной статистики Великобритании по
      обследованию рабочей силы. Частота публикации — месячная. Единица измерения
      на графике — процент. На графике — официальный сезонно скорректированный
      национальный ряд.

  - code_suffix: employed-persons
    name_ru: Численность занятых
    name_en: Number of people in employment (aged 16 and over, SA)
    category_ru: Рынок труда
    unit: THOUSANDS
    unit_ru: тыс. человек
    frequency: monthly
    provider: ons
    dataset_id: "LMS"
    series_id: "MGRZ"
    dimensions:
      uri_path: "employmentandlabourmarket/peopleinwork/employmentandemployeetypes/timeseries/mgrz/lms"
    source_url: "https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/timeseries/mgrz/lms"
    analog_ru: Занятость
    is_listed: true
    description: >
      Численность занятых в Великобритании среди населения 16 лет и старше, с
      учётом сезонной корректировки. Показывает масштаб занятости в экономике.
    methodology: >
      Ряд публикует Управление национальной статистики Великобритании по
      обследованию рабочей силы. Частота публикации — месячная. Единица измерения
      на графике — тысячи человек. На графике — официальный сезонно
      скорректированный национальный ряд.

  - code_suffix: gdp-real
    name_ru: Валовой внутренний продукт в постоянных ценах
    name_en: Gross domestic product, chained volume measures (SA)
    category_ru: ВВП
    unit: GBP_MN
    unit_ru: млн фунтов стерлингов (цепные объёмы)
    frequency: quarterly
    provider: ons
    dataset_id: "QNA"
    series_id: "ABMI"
    dimensions:
      uri_path: "economy/grossdomesticproductgdp/timeseries/abmi/qna"
    source_url: "https://www.ons.gov.uk/economy/grossdomesticproductgdp/timeseries/abmi/qna"
    analog_ru: ВВП реальный
    is_listed: true
    description: >
      Реальный валовой внутренний продукт Великобритании в цепных объёмах, с
      сезонной корректировкой. Показывает объём экономики без влияния изменения
      цен.
    methodology: >
      Ряд публикует Управление национальной статистики Великобритании в системе
      национальных счетов. Частота публикации — квартальная. Единица измерения на
      графике — миллионы фунтов стерлингов в цепных объёмах. Показан официальный
      сезонно скорректированный ряд без дополнительных преобразований.

