      Сезонно скорректированный индекс объёма розничных продаж в Великобритании
      по всем видам розничной торговли, включая топливо. Показывает изменение
      физического объёма розничных продаж относительно базового периода.
    methodology: >
      Ряд публикует Управление национальной статистики Великобритании. Частота
      публикации — месячная. Единица измерения на графике — индекс. На графике —
      официальный национальный ряд без дополнительных преобразований.

  - code_suffix: merchandise-exports
