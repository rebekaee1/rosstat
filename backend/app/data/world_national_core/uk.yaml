    unit: GBP_MN
    unit_ru: млн фунтов стерлингов
    frequency: monthly
    provider: ons
    dataset_id: "MRET"
    series_id: "IKBH"
    dimensions:
      uri_path: "economy/nationalaccounts/balanceofpayments/timeseries/ikbh/mret"
    source_url: "https://www.ons.gov.uk/economy/nationalaccounts/balanceofpayments/timeseries/ikbh/mret"
    analog_ru: Экспорт
    is_listed: true
    description: >
      Экспорт товаров и услуг Великобритании по методологии платёжного баланса,
      в текущих ценах, с сезонной корректировкой. Показывает стоимость вывезенных
      товаров и оказанных нерезидентам услуг за месяц.
    methodology: >
      Ряд публикует Управление национальной статистики Великобритании. Частота
      публикации — месячная. Единица измерения на графике — миллионы фунтов
      стерлингов. На графике — официальный национальный ряд без дополнительных
      преобразований.

  - code_suffix: population
    name_ru: Численность населения
    name_en: United Kingdom population mid-year estimate
    category_ru: Население
    unit: PERSONS
    unit_ru: человек
    frequency: annual
    provider: ons
    dataset_id: "pop"
    series_id: "UKPOP"
    dimensions:
      uri_path: "peoplepopulationandcommunity/populationandmigration/populationestimates/timeseries/ukpop/pop"
    source_url: "https://www.ons.gov.uk/peoplepopulationandcommunity/populationandmigration/populationestimates/timeseries/ukpop/pop"
