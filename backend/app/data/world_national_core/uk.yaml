# United Kingdom national-core passport (official ONS time-series JSON + BoE IADB CSV).
# Live-probed 2026-08-12. Loader: scripts/load-world-national.py --country uk
# Providers: ons → OnsTimeseriesAdapter (www.ons.gov.uk/…/timeseries/{cdid}/{dataset}/data);
#            boe_iadb → BoeIadbAdapter (bankofengland.co.uk/boeapps/iadb CSV).
# BoE default observation window starts 2000-01-01; on HTML/timeout the adapter
# shortens to 2010 then 2020. Expand with live-probed series; loader is
# idempotent and does not touch existing eurostat rows for UK.

country_code: UK

series:
  - code_suffix: cpi-all
    name_ru: Индекс потребительских цен
    name_en: Consumer Price Index (all items)
    category_ru: Цены
    unit: INDEX
    unit_ru: индекс (2015 = 100)
    frequency: monthly
    provider: ons
    dataset_id: "MM23"
    series_id: "D7BT"
    dimensions:
      uri_path: "economy/inflationandpriceindices/timeseries/d7bt/mm23"
    source_url: "https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/d7bt/mm23"
    analog_ru: ИПЦ
    is_listed: true
    description: >
      Индекс потребительских цен Великобритании по всем товарам и услугам
      корзины. Показывает, как меняется стоимость фиксированного набора товаров
      и услуг относительно базового периода.
    methodology: >
      Ряд публикует Управление национальной статистики Великобритании. Частота
      публикации — месячная. Единица измерения на графике — индекс (2015 = 100).
      На графике показан официальный национальный ряд без дополнительных
      преобразований.

  - code_suffix: cpih-all
    name_ru: Индекс потребительских цен с учётом жилищных расходов владельцев
    name_en: CPIH (all items)
    category_ru: Цены
    unit: INDEX
    unit_ru: индекс (2015 = 100)
    frequency: monthly
    provider: ons
    dataset_id: "MM23"
    series_id: "L522"
    dimensions:
      uri_path: "economy/inflationandpriceindices/timeseries/l522/mm23"
    source_url: "https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/l522/mm23"
    analog_ru: ИПЦ с жильём
    is_listed: true
    description: >
      Индекс потребительских цен Великобритании с учётом жилищных расходов
      владельцев жилья (CPIH) по всем товарам и услугам. Показывает изменение
      стоимости расширенной потребительской корзины относительно базового периода.
    methodology: >
      Ряд публикует Управление национальной статистики Великобритании. Частота
      публикации — месячная. Единица измерения на графике — индекс (2015 = 100).
      На графике — официальный национальный ряд без дополнительных преобразований.

  - code_suffix: unemployment-rate
    name_ru: Уровень безработицы
    name_en: Unemployment rate (aged 16 and over, SA)
    category_ru: Рынок труда
    unit: PERCENT
    unit_ru: "%"
    frequency: monthly
    provider: ons
    dataset_id: "LMS"
    series_id: "MGSX"
    dimensions:
      uri_path: "employmentandlabourmarket/peoplenotinwork/unemployment/timeseries/mgsx/lms"
    source_url: "https://www.ons.gov.uk/employmentandlabourmarket/peoplenotinwork/unemployment/timeseries/mgsx/lms"
    analog_ru: Уровень безработицы
    is_listed: true
    description: >
      Уровень безработицы в Великобритании среди населения 16 лет и старше, с
      учётом сезонной корректировки. Показывает долю безработных в экономически
      активном населении.
    methodology: >
      Ряд публикует Управление национальной статистики Великобритании по
      обследованию рабочей силы. Частота публикации — месячная. Единица измерения
      на графике — процент. На графике — официальный сезонно скорректированный
      национальный ряд.

  - code_suffix: employment-rate
    name_ru: Уровень занятости
    name_en: Employment rate (aged 16 to 64, SA)
    category_ru: Рынок труда
    unit: PERCENT
    unit_ru: "%"
    frequency: monthly
    provider: ons
    dataset_id: "LMS"
    series_id: "LF24"
    dimensions:
      uri_path: "employmentandlabourmarket/peopleinwork/employmentandemployeetypes/timeseries/lf24/lms"
    source_url: "https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/timeseries/lf24/lms"
    analog_ru: Уровень занятости
    is_listed: true
    description: >
      Уровень занятости в Великобритании среди населения 16–64 лет, с учётом
      сезонной корректировки. Показывает долю занятых в численности населения
      соответствующей возрастной группы.
    methodology: >
      Ряд публикует Управление национальной статистики Великобритании по
      обследованию рабочей силы. Частота публикации — месячная. Единица измерения
      на графике — процент. На графике — официальный сезонно скорректированный
      национальный ряд.

  - code_suffix: participation-rate
    name_ru: Уровень экономической активности
    name_en: Economic activity rate (aged 16 and over, SA)
    category_ru: Рынок труда
    unit: PERCENT
    unit_ru: "%"
    frequency: monthly
    provider: ons
    dataset_id: "LMS"
    series_id: "MGWG"
    dimensions:
      uri_path: "employmentandlabourmarket/peopleinwork/employmentandemployeetypes/timeseries/mgwg/lms"
    source_url: "https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/timeseries/mgwg/lms"
    analog_ru: Уровень участия
    is_listed: true
    description: >
      Уровень экономической активности населения Великобритании 16 лет и старше,
