    description: >
      Оценка численности постоянного населения Соединённого Королевства на
      середину года. Показывает, сколько человек проживает в стране по
      официальной оценке статистического ведомства.
    methodology: >
      Ряд публикует Управление национальной статистики Великобритании. Частота
      публикации — годовая. Единица измерения на графике — человек. На графике —
      официальная национальная оценка без дополнительных преобразований.

  - code_suffix: policy-rate
    name_ru: Официальная ключевая ставка Банка Англии
    name_en: Official Bank Rate
    category_ru: Финансы
    unit: PERCENT
    unit_ru: "%"
    frequency: daily
    provider: boe_iadb
    dataset_id: "IUDBEDR"
    series_id: "IUDBEDR"
    source_url: "https://www.bankofengland.co.uk/boeapps/database/Bank-Rate.asp"
    analog_ru: Ключевая ставка
    is_listed: true
    description: >
      Официальная ключевая ставка Банка Англии — операционный ориентир
      денежно-кредитной политики. Показывает уровень, к которому центральный банк
      направляет краткосрочные ставки денежного рынка.
    methodology: >
      Ряд публикует Банк Англии. Частота публикации — дневная (рабочие дни).
      Единица измерения на графике — процент годовых. Значения соответствуют
      официальному ряду ключевой ставки без пересчёта на стороне платформы.

  - code_suffix: fx-gbp-usd
    name_ru: Курс фунта стерлингов к доллару США
    name_en: GBP/USD spot exchange rate (USD per GBP)
    category_ru: Финансы
    unit: USD_PER_GBP
    unit_ru: долларов США за 1 фунт стерлингов
    frequency: daily
    provider: boe_iadb
    dataset_id: "XUDLUSS"
    series_id: "XUDLUSS"
    source_url: "https://www.bankofengland.co.uk/boeapps/database/Rates.asp"
    analog_ru: Курс к доллару США
    is_listed: true
    description: >
      Дневной спот-курс фунта стерлингов к доллару США по данным Банка Англии.
      Показывает, сколько долларов США приходится на один фунт стерлингов.
    methodology: >
      Ряд публикует Банк Англии. Частота публикации — дневная (рабочие дни).
      Единица измерения на графике — число долларов США за один фунт стерлингов.
      Значения соответствуют официальному дневному курсу из статистической базы
      Банка Англии.
