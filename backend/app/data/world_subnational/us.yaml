# United States subnational passport (50 states + District of Columbia).
# Official series via FRED keyless CSV (BLS LAUS/CES, BEA, Census, FHFA).
# Live-probed 2026-09-20 on California, New York and District of Columbia.
# Omitted: poverty (SAIPE series id is not a stable {geo} template) and
# state tax collections (no District of Columbia series). Weekly claims skipped.
# Placeholders: {geo} = postal code, {fips} = 2-digit FIPS, {series_id} after expand.
# Loader: backend/scripts/load-world-subnational.py --country us

country_code: US
country_slug: united-states
region_kind_label_en: State
region_kind_label_ru: Штат
region_kind_label_en_plural: States
region_kind_label_ru_plural: Штаты
default_indicator: unemployment-rate
map_id: us-states

