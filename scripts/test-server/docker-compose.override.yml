# Тестовый (демо) сервер: 2 vCPU / 3,9 ГБ RAM, наружу только через cloudflared (127.0.0.1:80).
# Файл не входит в Git (лежит рядом с docker-compose.yml на сервере); эталон — scripts/test-server/docker-compose.override.yml.
# Лимиты памяти урезаны под хост; прод — 4 vCPU / 8 ГБ.
services:
  postgres:
    ports: !override []
  redis:
    ports: !override []
  frontend:
    # Сборка с host-сетью: из docker-сети хоста pip/npm таймаутят (ловушка 2026-08/09).
    build:
      network: host
    ports: !override
      - "127.0.0.1:80:80"
    # Лимиты запросов nginx подняты (генерируется deploy.sh из frontend/nginx.conf): все посетители и проверяющие агенты
    # приходят с одного внешнего адреса, и боевой лимит 5 запросов/с на адрес отдавал им «429 Too Many Requests».
    volumes:
      - /root/nginx-test.conf:/etc/nginx/conf.d/default.conf:ro
  backend:
    build:
      network: host
    # Лимит API на адрес поднят: проверяющие и агенты приходят с одного внешнего адреса (боевые 120/600 в минуту).
    environment:
      RUSTATS_API_RATE_LIMIT: "6000"
      RUSTATS_EMBED_RATE_LIMIT: "6000"
    deploy:
      resources:
        limits:
          memory: 900M
          cpus: '1.5'
  scheduler:
    deploy:
      resources:
        limits:
          memory: 700M
          cpus: '0.8'
