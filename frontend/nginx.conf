# Forecast Economy frontend — nginx

# П-22 (CTO-аудит 2026-07-06): rate-limit SSR-страниц. /api/ лимитируется
# приложением (slowapi), а SSR-HTML и OG-PNG не лимитировались вовсе — бот с
# нестандартным UA мог прожигать CPU рендерами. Поисковые краулеры (Яндекс,
# Google, Bing, Mail.ru, ИИ-боты) исключены: пустой ключ = без лимита.
# Directives ниже — http-контекст (conf.d include).
# ВАЖНО: только non-capturing группы (?:…) — capture-группа в map перетирает
# $1 location-регекспов, и proxy_pass уходит на /seo/indicator/Yandex.
map $http_user_agent $ssr_limit_key {
    default $binary_remote_addr;
    "~*(?:yandex|googlebot|bingbot|mail\.ru|duckduckbot|applebot|gptbot|petalbot|amazonbot|claudebot|perplexitybot|youbot)" "";
}
limit_req_zone $ssr_limit_key zone=ssr:10m rate=5r/s;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Реальный IP клиента из X-Forwarded-For от Caddy edge (docker-сеть —
    # приватные диапазоны). Без этого $binary_remote_addr = IP контейнера
    # Caddy и все посетители делили бы один rate-limit-бакет.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_status 429;

    # Security headers managed by Caddy edge proxy (not here).
    # nginx location-level add_header overrides server-level, so placing
    # them here is ineffective for SPA routes that set Cache-Control.

    # О-17/О-18: границы для всех проксируемых locations (наследуются в
    # location-контексты). Body-limit покрывает и /api/v1/analytics/behavior:
    # p99 батча << 256KB, лимит с запасом (Р-12); всё остальное — GET.
    client_max_body_size 512k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml image/svg+xml;

    # Trailing slash → canonical without slash (301)
    rewrite ^(.+)/$ $1 permanent;

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Sitemap-индекс + секции (/sitemap.xml, /sitemap-core.xml, /sitemap-regional-1.xml, …)
    location ~ ^/sitemap(-[a-z0-9-]+)?\.xml$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(svg|png|jpg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Consent-bootstrap (152-ФЗ): не хэшируется Vite, поэтому no-cache —
    # stale-версия не должна пережить релиз и грузить трекеры без согласия.
    location = /consent.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Self-hosted шрифты: woff2 ловит общий статик-регекс (30d), css без
    # хэша — короткий кэш, чтобы смена состава шрифтов не застревала.
    location = /fonts/fonts.css {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Raw Vite SPA shell for the backend SEO renderer to discover current
    # hashed JS/CSS assets. Public route is intentionally obscure; indexable
    # pages below never serve this raw shell directly.
    location = /__spa-index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # SSR HTML — ВСЕГДА no-cache + must-revalidate, чтобы при каждом деплое
    # пользовательский браузер запросил свежий HTML и обнаружил новые
    # asset-hash'и (см. AGENTS.md «Asset-hash trap»).
    #   * `proxy_hide_header Cache-Control` — на случай, если backend
    #     случайно проставит свой (FastAPI HTMLResponse этого не делает,
    #     но защищаемся от регрессии).
    #   * `add_header ... always` — `add_header` без `always` не работает
    #     для 4xx/5xx ответов; для SSR это критично — иначе ошибочный
    #     ответ сервера получит heuristic-кеш браузера и пользователь
    #     застрянет на нём после релиза.
    location = / {
        proxy_pass http://backend:8000/seo/page/home;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ssr burst=15 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~ ^/(?<seo_page>about|methodology|privacy|terms|compare|calculator|calendar|demographics|widgets)/?$ {
        proxy_pass http://backend:8000/seo/page/$seo_page;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ssr burst=15 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Дочерние калькуляторы (/calculator/mortgage → seo/page/calculator-mortgage).
    location ~ ^/calculator/(?<calc_kind>mortgage|compound)/?$ {
        proxy_pass http://backend:8000/seo/page/calculator-$calc_kind;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ssr burst=15 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~ ^/category/(?<cat_slug>[a-z0-9-]+)/?$ {
        proxy_pass http://backend:8000/seo/category/$cat_slug;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ssr burst=15 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~ ^/indicator/(?<ind_code>[a-z0-9-]+)/?$ {
        # $is_args$args обязателен: при proxy_pass с URI nginx не передаёт
        # query string — без этого ?mode=sum-quarter теряется на SSR.
        proxy_pass http://backend:8000/seo/indicator/$ind_code$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ssr burst=15 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Годовые landing-страницы (long-tail SEO): чистый SSR без React-bundle.
    location ~ "^/indicator/(?<indy_code>[a-z0-9-]+)/(?<indy_year>(?:19|20)[0-9]{2})/?$" {
        proxy_pass http://backend:8000/seo/indicator-year/$indy_code/$indy_year;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ssr burst=15 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Региональный блок: лендинг, карта по показателю, регион, показатель (SSR).
    location = /regions {
        proxy_pass http://backend:8000/seo/regions;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ssr burst=15 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Карта регионов по показателю (shareable SEO): /regions/map/{code}?year=
    # $is_args$args обязателен: при proxy_pass с URI nginx не передаёт query
    # (тот же trap, что у /indicator/?mode=).
    location ~ ^/regions/map/(?<rm_code>[a-z0-9-]+)/?$ {
        proxy_pass http://backend:8000/seo/regions/map/$rm_code$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ssr burst=15 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~ ^/region/(?<reg_slug>[a-z0-9-]+)/?$ {
        proxy_pass http://backend:8000/seo/region/$reg_slug;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ssr burst=15 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~ ^/region/(?<regi_slug>[a-z0-9-]+)/(?<regi_code>[a-z0-9-]+)/?$ {
        proxy_pass http://backend:8000/seo/region/$regi_slug/$regi_code;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ssr burst=15 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Рейтинги регионов по показателю (чистый SSR, без SPA-маршрута).
    location ~ ^/region-rating/(?<rr_code>[a-z0-9-]+)/?$ {
        proxy_pass http://backend:8000/seo/region-rating/$rr_code;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ssr burst=15 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Сравнение двух регионов: /region-vs/{a}-vs-{b} (чистый SSR).
    location ~ ^/region-vs/(?<rvs_pair>[a-z0-9-]+)/?$ {
        proxy_pass http://backend:8000/seo/region-vs/$rvs_pair;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ssr burst=15 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # «На сегодня»: хаб и страницы показателей (чистый SSR).
    location = /today {
        proxy_pass http://backend:8000/seo/today;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ssr burst=15 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~ ^/today/(?<today_code>[a-z0-9-]+)/?$ {
        proxy_pass http://backend:8000/seo/today/$today_code;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ssr burst=15 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Месячные посадочные календаря статистики (чистый SSR).
    location ~ "^/calendar/(?<cal_year>(?:20)[0-9]{2})/(?<cal_month>[0-9]{2})/?$" {
        proxy_pass http://backend:8000/seo/calendar-month/$cal_year/$cal_month;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=ssr burst=15 nodelay;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # OG-превью индикаторов: /og/{code}.png → backend PNG-рендер.
    # ^~ обязателен: иначе выигрывает более ранний статик-regex \.(png|...)$
    # и nginx ищет файл на диске вместо proxy.
    location ^~ /og/ {
        # Региональный вариант (/og/region/{slug}/{code}.png) — самый специфичный.
        rewrite "^/og/region/([a-z0-9-]+)/([a-z0-9-]+)\.png$" /api/v1/og-image/region/$1/$2.png break;
        # Хабовые картинки (рейтинг регионов, сравнение регионов, сводка «сегодня»).
        rewrite "^/og/region-rating/([a-z0-9-]+)\.png$" /api/v1/og-image/region-rating/$1.png break;
        rewrite "^/og/region-vs/([a-z0-9-]+)-vs-([a-z0-9-]+)\.png$" /api/v1/og-image/region-vs/$1-vs-$2.png break;
        rewrite "^/og/today\.png$" /api/v1/og-image/today.png break;
        # Годовой вариант (/og/{code}/{year}.png) — более специфичный, проверяем первым.
        rewrite "^/og/([a-z0-9-]+)/([0-9]{4})\.png$" /api/v1/og-image/indicator/$1/$2.png break;
        rewrite "^/og/([a-z0-9-]+)\.png$" /api/v1/og-image/indicator/$1.png break;
        limit_req zone=ssr burst=15 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    # RSS-фид обновлений данных.
    location = /feed.xml {
        proxy_pass http://backend:8000/feed.xml;
        proxy_set_header Host $host;
        expires 30m;
        add_header Cache-Control "public";
    }

    # Backward-compatible internal social preview routes.
    location ~ ^/og-proxy/indicator/([a-z0-9-]+) {
        internal;
        proxy_pass http://backend:8000/api/v1/og/indicator/$1;
        proxy_set_header Host $host;
    }

    location ~ ^/og-proxy/category/([a-z0-9-]+) {
        internal;
        proxy_pass http://backend:8000/api/v1/og/category/$1;
        proxy_set_header Host $host;
    }

    location ~ ^/og-proxy/page/([a-z]+) {
        internal;
        proxy_pass http://backend:8000/api/v1/og/page/$1;
        proxy_set_header Host $host;
    }

    # Embed widget routes — security headers managed by Caddy edge proxy
    location ~ ^/embed/(chart|card|table|ticker|compare)(/[a-z0-9-]+)?/?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Embed builder page (regular page, NOT frameable)
    location ~ ^/widgets/?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Личный кабинет (ADR-0007): приватные SPA-маршруты. Отдаём чистый shell
    # (без SSR — SEO не нужно) и X-Robots-Tag noindex. try_files на index.html,
    # иначе catch-all ниже вернёт 404 при прямом переходе/перезагрузке.
    location ~ ^/(login|register|account)/?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Админ-BI (/admin/bi): служебный SPA-маршрут, доступ проверяет backend
    # (settings.admin_emails), для остальных страница «не существует» (404 API).
    location ~ ^/admin/bi/?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Catch-all: return 404 for unknown routes (not SPA fallback)
    location / {
        try_files $uri =404;
    }
}
