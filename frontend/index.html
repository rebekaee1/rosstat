        <p>Бесплатная аналитическая платформа: экономика России, регионы и доступная статистика стран — цены, ставки, финансы, ВВП, рынок труда, торговля, население, бизнес, наука и др. Просмотр без регистрации; скачивание — после бесплатной регистрации.</p>
        <p><a href="/about">О проекте</a> · <a href="/privacy">Политика конфиденциальности</a> · <a href="/world">Мировая экономика</a> · <a href="/regions">Регионы России</a></p>
        <h2>Категории</h2>
