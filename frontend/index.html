    <!-- Волна 6 (1.1): фирменная заставка до первого кадра приложения. Блок дублирует
         BOOT_* в backend/app/services/seo_renderer.py (тест test_boot_splash_in_sync).
         Круг 6: холодный фон #F4F5F7, глобус синий #5B7DB1, золото #B08A3E только точка и угол F (прежняя тёплая бумага снята);
         те же значения нужно перенести в _BOOT_STYLE и разметку заставки seo_renderer.py;
         класс fe-boot ставит скрипт, снимает приложение (spaReveal) или таймер на 12 с.
         Без JS заставки нет. В оболочке нет серверного текста, поэтому подписи нет. -->
    <style id="fe-boot-css">
      html{background:#F4F5F7;color-scheme:light}
      @font-face{font-family:Manrope;src:url('/fonts/manrope-latin-cyrillic.woff2') format('woff2');font-weight:200 800;font-display:swap}
      .fe-boot-splash{display:none}
      html.fe-boot{overflow:hidden}
      html.fe-boot #root{visibility:hidden}
      html.fe-boot .fe-boot-splash{display:flex;position:fixed;inset:0;z-index:2147483000;flex-direction:column;align-items:center;gap:26px;box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 14vh) 20px 24px;background:radial-gradient(ellipse at 88% 0%,rgba(124,154,201,.26),transparent 46%),radial-gradient(ellipse at 6% 100%,rgba(201,215,234,.42),transparent 40%),#F4F5F7;color:#202A3C;font-family:Manrope,system-ui,sans-serif}
      html.fe-js .fe-boot-splash{display:none!important}
      .fe-boot-brand{display:inline-flex;align-items:center;gap:.6rem;font-size:1.65rem;font-weight:750;letter-spacing:-.06em;line-height:1}
      .fe-boot-brand svg{width:34px;height:39px}
      .fe-boot-brand i{font-style:normal;font-weight:400}
      .fe-boot-globe{width:132px;height:132px;color:#5B7DB1}
      .fe-boot-globe .fe-g-ring{fill:rgba(255,255,255,.55);stroke:currentColor;stroke-width:1.4;stroke-dasharray:6 5;animation:feBootRing 7s linear infinite;transform-origin:60px 60px}
      .fe-boot-globe .fe-g-m{fill:none;stroke:currentColor;stroke-width:1.1;opacity:.55;transform-box:fill-box;transform-origin:center;animation:feBootSpin 3.2s ease-in-out infinite}
      .fe-boot-globe .fe-g-m:nth-of-type(2){animation-delay:-1.07s}
      .fe-boot-globe .fe-g-m:nth-of-type(3){animation-delay:-2.13s}
      .fe-boot-globe .fe-g-p{fill:none;stroke:currentColor;stroke-width:1;opacity:.35}
      .fe-boot-globe .fe-g-dot{fill:#B08A3E;animation:feBootPulse 1.6s ease-in-out infinite}
      .fe-boot-skel{display:flex;flex-direction:column;gap:10px;width:100%;max-width:26rem;margin-top:6px}
      .fe-boot-skel b{display:block;height:14px;border-radius:8px;background:linear-gradient(100deg,rgba(255,255,255,.35) 30%,rgba(255,255,255,.95) 50%,rgba(255,255,255,.35) 70%) 0 0/220% 100%,rgba(30,58,110,.08);animation:feBootShim 1.6s linear infinite}
      .fe-boot-skel b:nth-child(1){width:46%}
      .fe-boot-skel b:nth-child(2){height:84px;border-radius:18px}
      .fe-boot-skel b:nth-child(3){width:72%}
      @keyframes feBootRing{to{transform:rotate(360deg)}}
      @keyframes feBootSpin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.06)}}
      @keyframes feBootPulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes feBootShim{to{background-position:-220% 0,0 0}}
      @media(prefers-reduced-motion:reduce){.fe-boot-splash *{animation:none!important}}
    </style>

      <div style="max-width:800px;margin:40px auto;padding:20px;font-family:sans-serif">
        <h1>Forecast Economy — макроэкономические индикаторы стран</h1>
        <p>Официальная статистика по странам: графики, рейтинги, сравнения и прогнозы. По России — более 100 макроиндикаторов и 495 региональных показателей. Просмотр без регистрации; скачивание — после бесплатной регистрации.</p>
        <p><a href="/about">О проекте</a>, <a href="/privacy">Политика конфиденциальности</a>, <a href="/world/rating">Рейтинг стран</a>, <a href="/russia/region">Регионы России</a></p>
        <h2>Категории макропоказателей России</h2>
        <ul>
          <li><a href="/russia/category/prices">Цены и инфляция</a> — ИПЦ, инфляция, еженедельные данные</li>
          <li><a href="/russia/category/rates">Процентные ставки</a> — ключевая ставка, RUONIA, ипотека</li>
          <li><a href="/currencies">Валюты</a> — курсы к рублю, мировые пары и криптовалюты</li>
          <li><a href="/russia/category/finance">Деньги и бюджет</a> — резервы, денежная масса, бюджет</li>
          <li><a href="/russia/category/indices">Биржевые индексы</a> — индексы МосБиржи</li>
          <li><a href="/russia/category/commodities">Товарные рынки</a> — нефть, золото, криптовалюты</li>
          <li><a href="/russia/category/labor">Рынок труда</a> — безработица, зарплаты, занятость</li>
          <li><a href="/russia/category/gdp">ВВП и рост</a> — ВВП, потребление, госрасходы</li>
          <li><a href="/russia/category/population">Население</a> — демография, рождаемость, смертность</li>
          <li><a href="/russia/category/trade">Внешняя торговля</a> — экспорт, импорт, платёжный баланс</li>
          <li><a href="/russia/category/business">Бизнес и инвестиции</a> — ИПП, жильё, основные фонды</li>
          <li><a href="/russia/category/science">Наука и образование</a> — аспиранты, НИР, инновации</li>
        </ul>
        <h2>О платформе</h2>
        <p>Данные загружаются автоматически из Евростата, МВФ, национальных статистических ведомств, Росстата, Банка России и Минфина. Для каждого индикатора доступны: исторический ряд, график, таблица и — где это оправдано — прогноз.</p>
        <p>Источники: <a href="https://ec.europa.eu/eurostat">Евростат</a>, <a href="https://www.imf.org">МВФ</a>, <a href="https://rosstat.gov.ru">Росстат</a>, <a href="https://cbr.ru">Банк России</a>, <a href="https://minfin.gov.ru">Минфин</a></p>
