name: zone6-claim

on:
  push:
    branches: [cursor/seo-internal-linking-2569]
    paths: ['.github/workflows/zone6-claim-comment.yml']

permissions:
  issues: write

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: Post CLAIM zone-6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAIM_BODY: |
            CLAIM zone-6: Internal linking, navigation, orphan pages, SEO hubs

            PR: https://github.com/rebekaee1/rosstat/pull/8

            Files:
            - frontend/src/lib/footerNav.js
            - frontend/src/lib/footerNav.test.js
            - frontend/src/components/Footer.jsx
            - frontend/src/components/CalculatorSiblings.jsx
            - frontend/src/components/Navbar.component.test.jsx
            - frontend/src/i18n/messages.ru.js
            - frontend/src/i18n/messages.en.js
            - frontend/src/pages/RussiaHome.jsx
            - frontend/src/pages/RegionsHome.jsx
            - frontend/src/pages/RegionIndicatorPage.jsx
            - frontend/src/pages/RegionComparePage.jsx
            - frontend/src/pages/IndicatorDetail.jsx
            - frontend/src/pages/CalculatorPage.jsx
            - frontend/src/pages/MortgageCalculatorPage.jsx
            - frontend/src/pages/CompoundCalculatorPage.jsx
            - frontend/src/pages/ComparePage.jsx
            - frontend/src/pages/CalendarPage.jsx
            - frontend/src/pages/About.jsx
            - frontend/src/pages/Methodology.jsx
            - frontend/src/pages/Privacy.jsx
            - frontend/src/pages/Terms.jsx
            - frontend/src/pages/EmbedBuilder.jsx
            - backend/app/services/seo_renderer.py
            - backend/app/services/seo_content.py
            - backend/app/data/i18n/seo_en.py
            - backend/tests/test_seo_og.py

            Out of scope for this zone: BreadcrumbList JSON-LD (zone 4), robots/canonical (zone 1), hreflang (zone 2), sitemap XML (zone 5). No deploy.
        run: gh api --method POST repos/rebekaee1/rosstat/issues/2/comments -f body="$CLAIM_BODY"
