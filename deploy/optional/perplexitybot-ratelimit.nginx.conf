# ОТКЛЮЧЕНО. Не подключено ни в frontend/nginx.conf, ни в Dockerfile.
# Черновик общего (не per-IP) лимита для PerplexityBot: он ходит с десятков
# IP, поэтому per-IP зоны ssr/ssrstrict его не ограничивают. 2026-09-26:
# ~3.1k из ~9.8k запросов за час (≈0.87 r/s в среднем, пачками).
#
# Как включить (отдельным одобренным коммитом):
#  1) блок «http context» ниже вставить в frontend/nginx.conf рядом с
#     limit_req_zone ... zone=ssr (файл целиком в conf.d = http context);
#  2) в каждую SSR-локацию, где стоит `limit_req zone=ssr ...` или
#     `limit_req zone=ssrstrict ...`, добавить строку из «location context».
#     (limit_req с уровня server в локации со своим limit_req не наследуется.)
#  3) deploy/test-nginx-config.sh, затем обычный деплой.
# Пустой ключ = без лимита, поэтому остальные клиенты не затрагиваются.
# 429 через limit_req_status (уже задан в server). robots.txt не лимитируется
# (у него нет SSR-локации с limit_req).

# ---- http context ----
map $http_user_agent $perplexity_rl_key {
    default "";
    "~*perplexitybot" "perplexitybot";
}
# 30 r/m ≈ 0.5 r/s на всех IP бота вместе; burst 10 сглаживает пачки.
limit_req_zone $perplexity_rl_key zone=perplexitybot:1m rate=30r/m;

# ---- location context (в каждую SSR-локацию с limit_req) ----
#        limit_req zone=perplexitybot burst=10 nodelay;
