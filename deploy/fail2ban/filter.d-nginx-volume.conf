# fail2ban: объём SSR с одного IP без 429 (стелс-обход каталога).
# Лог: /var/log/rosstat-nginx/security.log
#   2026-09-03T14:42:00+00:00 1.2.3.4 200 "GET /russia/region/x HTTP/1.1" "Mozilla/5.0 …"
# Поисковики исключены ignoreregex. Порог — в jail.local (80/10 мин).

[Definition]
failregex = ^\S+ <HOST> (?:200|301|302|304) "GET /
ignoreregex = (?i)(?:yandex|googlebot|bingbot|mail\.ru|duckduckbot|applebot|gptbot|petalbot|amazonbot|claudebot|perplexitybot|youbot)
