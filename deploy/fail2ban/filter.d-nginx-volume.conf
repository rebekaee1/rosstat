# fail2ban: объём SSR с одного IP без 429 (стелс-обход каталога).
# Лог: /var/log/rosstat-nginx/security.log
# fail2ban снимает ISO8601-дату сам; failregex видит хвост:
#   1.2.3.4 200 "GET /russia/region/x HTTP/1.1" "Mozilla/5.0 …"
# Только HTML-каталог. Тикер /api/v1/ticker/live, ассеты, OG, health —
# не считаются: живая вкладка иначе наберёт порог 80 / 10 мин.
# Поисковики — тот же список, что $ssr_limit_key в frontend/nginx.conf.
# Порог — в jail.local (80/10 мин).

[Definition]
failregex = ^\s*<HOST> (?:200|301|302|304) "GET /(?!api/|assets/|og/|fonts/|health(?:/|\s)|[^\s"]+\.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|map|json|xml|txt|webp))
ignoreregex = (?i)(?:yandex|googlebot|googleother|google-inspectiontool|adsbot-google|bingbot|mail\.ru|duckduckbot|applebot|gptbot|petalbot|amazonbot|amzn-searchbot|claudebot|perplexitybot|youbot|meta-externalagent|facebookexternalhit)
