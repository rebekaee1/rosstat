# fail2ban фильтр: nginx 429 на HTML-каталоге (rate-limit сработал).
# Лог: /var/log/rosstat-nginx/security.log
# fail2ban снимает ISO8601-дату сам; failregex видит хвост:
#   1.2.3.4 429 "GET /russia/region/x HTTP/1.1" "UA"
# Тикер и behavior (/api/) 429 не считаем: живая вкладка иначе наберёт 30/10 мин.
# Поисковики в $ssr_limit_key 429 не получают (пустой ключ).

# 15.11.2026: отказы запросов со служебным пропуском наших агентов (cls=staff, scripts/ops/staff-pass.sh) и с пропуском
# человека (cls=human) не считаются: у них свой бюджет в nginx (passcold на id пропуска), бан адреса на сутки за них -
# лишний. Класс ставит nginx по проверенной подписи cookie; подделанный пропуск даёт anon и считается как раньше.
# Привязка к концу строки: UA с текстом «cls=staff» внутри кавычек не совпадёт.

[Definition]
failregex = ^\s*<HOST> 429 "GET /(?!api/|assets/|og/|fonts/|health(?:/|\s)|[^\s"]+\.(?:js|css|png|jpe?g|gif|svg|ico|woff2?|map|json|xml|txt|webp))
ignoreregex = (?i)(?:yandex|googlebot|googleother|google-inspectiontool|adsbot-google|bingbot|mail\.ru|duckduckbot|applebot|gptbot|petalbot|amazonbot|amzn-searchbot|claudebot|perplexitybot|youbot|meta-externalagent|facebookexternalhit|\scls=(?:staff|human)\s*$)
