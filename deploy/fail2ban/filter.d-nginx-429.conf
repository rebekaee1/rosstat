# fail2ban фильтр: nginx 429 (rate-limit сработал)
# Лог: /var/log/rosstat-nginx/security.log
# Формат строки (log_format security):
#   2026-08-27T10:15:26+00:00 1.2.3.4 429 "GET /russia/region/x HTTP/1.1" "UA"
# datepattern ISO8601 с таймзоной; client — второе поле. Пробел после 429 в
# шаблоне не нужен: \b отсекает ложные «4290».

[Definition]
failregex = ^\S+ <HOST> 429\b
ignoreregex =
