# fail2ban фильтр: ханипот /russia/util/links-exchange
# Лог: /var/log/rosstat-nginx/honeypot.log
# Формат строки (log_format honeypot):
#   2026-08-27T10:15:26+00:00 1.2.3.4 403 "GET /russia/util/links-exchange HTTP/1.1" "UA"
# В лог попадают только запросы ханипота (access_log в его location), любой
# hit — нарушитель. В security.log 403 также дают UA-заблокированные —
# этот фильтр их не видит (другой файл), чтобы не двойного бана по одному IP.

[Definition]
failregex = ^\S+ <HOST> 403\b
ignoreregex =
