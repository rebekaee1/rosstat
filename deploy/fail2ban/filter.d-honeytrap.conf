# fail2ban фильтр: ханипот /russia/util/links-exchange
# Лог: /var/log/rosstat-nginx/honeypot.log
# fail2ban снимает ISO8601-дату сам; failregex видит хвост:
#   1.2.3.4 403 "GET /russia/util/links-exchange HTTP/1.1" "UA"
# В лог попадают только запросы ханипота (access_log в его location).
# Поисковики — тот же список, что $ssr_limit_key в frontend/nginx.conf:
# Яндекс ходит на /__honeypot__/trap, если URL когда-то был в sitemap.

[Definition]
failregex = ^\s*<HOST> 403\b
ignoreregex = (?i)(?:yandex|googlebot|googleother|google-inspectiontool|adsbot-google|bingbot|mail\.ru|duckduckbot|applebot|gptbot|petalbot|amazonbot|claudebot|perplexitybot|youbot|meta-externalagent|facebookexternalhit)
