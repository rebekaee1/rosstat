services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rustats
      POSTGRES_USER: rustats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rustats_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # О-10: 512M было впритык при региональной перезаливке (~1M строк) +
          # pg_dump бэкапа поверх рабочей нагрузки; 1G даёт запас без риска
          # выесть память хоста (4GB VPS: backend ~1G + postgres 1G + прочее).
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustats"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # О-8: maxmemory ниже cgroup-лимита — переполнение не превращается в OOM-kill.
    # Политика через env: state переехал на redis-state (см. ниже) —
    # allkeys-lru безопасен, сессии больше не в этом инстансе.
    # 2026-07-08: 100mb было впритык (региональный SSR-кэш fe:ssr-region:*
    # ~1940 ключей ≈ 95 МБ забивал лимит целиком) — поднято до 256mb.
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 256mb --maxmemory-policy ${REDIS_CACHE_POLICY:-noeviction}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 320M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-state:
    image: redis:7-alpine
    # О-8: выделенный инстанс для state (сессии/lockout/квоты) — noeviction +
    # AOF-persistence: сессии пользователей не выселяются и переживают рестарт.
    # Включение: RUSTATS_STATE_REDIS_URL=redis://:<pass>@redis-state:6379/0 в .env
    # (одноразовый разлогин всех — применять по команде владельца, см. Р-4).
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 48mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_state_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Прод-сервер резолвит api.telegram.org только в IPv6, а IPv6-маршрут до
    # Telegram у хостера мёртвый (ConnectTimeout) → уведомления и дайджест тихо
    # падали. Прибиваем имя к рабочему IPv4 Telegram API DC (стабильный годами).
    # Override через TELEGRAM_API_IP, если Telegram сменит IP. См. CONTEXT.md trap.
    extra_hosts:
      - "api.telegram.org:${TELEGRAM_API_IP:-149.154.167.220}"
    ports:
      - "127.0.0.1:8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    environment:
      RUSTATS_DATABASE_URL: postgresql+asyncpg://rustats:${POSTGRES_PASSWORD:-rustats_dev}@postgres:5432/rustats
      RUSTATS_REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      # П-16: дисковый кэш OG-картинок (переживает рестарт контейнера)
      OG_CACHE_DIR: /app/og-cache
      RUSTATS_ROSSTAT_CA_CERT: /app/certs/russiantrustedca2024.pem
      RUSTATS_SCHEDULER_ENABLED: "true"
      # First-party приём событий фронта (питает «Пульс»). По умолчанию ON и
      # НЕ зависит от ANALYTICS_ENABLED — иначе на проде телеметрия не пишется.
      RUSTATS_FRONTEND_EVENTS_ENABLED: ${RUSTATS_FRONTEND_EVENTS_ENABLED:-true}
      RUSTATS_ANALYTICS_ENABLED: ${RUSTATS_ANALYTICS_ENABLED:-false}
      RUSTATS_ANALYTICS_SCHEDULER_ENABLED: ${RUSTATS_ANALYTICS_SCHEDULER_ENABLED:-false}
      RUSTATS_ANALYTICS_API_TOKEN: ${RUSTATS_ANALYTICS_API_TOKEN:-}
      RUSTATS_ANALYTICS_ALLOWED_COUNTER_IDS: ${RUSTATS_ANALYTICS_ALLOWED_COUNTER_IDS:-107136069}
      RUSTATS_ANALYTICS_ALLOWED_HOSTS: ${RUSTATS_ANALYTICS_ALLOWED_HOSTS:-forecasteconomy.com}
      RUSTATS_ANALYTICS_LIVE_WRITES_ENABLED: ${RUSTATS_ANALYTICS_LIVE_WRITES_ENABLED:-false}
      RUSTATS_YANDEX_METRIKA_READ_TOKEN: ${RUSTATS_YANDEX_METRIKA_READ_TOKEN:-}
      RUSTATS_YANDEX_METRIKA_WRITE_TOKEN: ${RUSTATS_YANDEX_METRIKA_WRITE_TOKEN:-}
      RUSTATS_YANDEX_WEBMASTER_TOKEN: ${RUSTATS_YANDEX_WEBMASTER_TOKEN:-}
      RUSTATS_DEBUG: ${RUSTATS_DEBUG:-false}
      # Личный кабинет (ADR-0007). fake-провайдер и debug по умолчанию off (prod-safe);
      # для локального E2E включаются явно через .env / переменные окружения.
      RUSTATS_AUTH_COOKIE_SECURE: ${RUSTATS_AUTH_COOKIE_SECURE:-false}
      RUSTATS_AUTH_PUBLIC_BASE_URL: ${RUSTATS_AUTH_PUBLIC_BASE_URL:-http://localhost:3000}
      RUSTATS_AUTH_FAKE_PROVIDER_ENABLED: ${RUSTATS_AUTH_FAKE_PROVIDER_ENABLED:-false}
      RUSTATS_OAUTH_YANDEX_CLIENT_ID: ${RUSTATS_OAUTH_YANDEX_CLIENT_ID:-}
      RUSTATS_OAUTH_YANDEX_CLIENT_SECRET: ${RUSTATS_OAUTH_YANDEX_CLIENT_SECRET:-}
      RUSTATS_OAUTH_YANDEX_SCOPE: ${RUSTATS_OAUTH_YANDEX_SCOPE:-}
      RUSTATS_OAUTH_YANDEX_REDIRECT_URI: ${RUSTATS_OAUTH_YANDEX_REDIRECT_URI:-}
      RUSTATS_OAUTH_VK_CLIENT_ID: ${RUSTATS_OAUTH_VK_CLIENT_ID:-}
      RUSTATS_OAUTH_VK_CLIENT_SECRET: ${RUSTATS_OAUTH_VK_CLIENT_SECRET:-}
      RUSTATS_OAUTH_VK_SERVICE_KEY: ${RUSTATS_OAUTH_VK_SERVICE_KEY:-}
      RUSTATS_OAUTH_VK_SCOPE: ${RUSTATS_OAUTH_VK_SCOPE:-}
      RUSTATS_OAUTH_VK_REDIRECT_URI: ${RUSTATS_OAUTH_VK_REDIRECT_URI:-}
      RUSTATS_DOWNLOAD_ANON_LIMIT: ${RUSTATS_DOWNLOAD_ANON_LIMIT:-0}
      RUSTATS_DOWNLOAD_ANON_HISTORY_YEARS: ${RUSTATS_DOWNLOAD_ANON_HISTORY_YEARS:-3}
      # Telegram-бот: уведомления о регистрациях + ежедневный дайджест
      RUSTATS_TELEGRAM_BOT_TOKEN: ${RUSTATS_TELEGRAM_BOT_TOKEN:-}
      RUSTATS_TELEGRAM_CHAT_ID: ${RUSTATS_TELEGRAM_CHAT_ID:-}
      RUSTATS_TELEGRAM_DIGEST_ENABLED: ${RUSTATS_TELEGRAM_DIGEST_ENABLED:-false}
      RUSTATS_TELEGRAM_DIGEST_CHAT_IDS: ${RUSTATS_TELEGRAM_DIGEST_CHAT_IDS:-}
      RUSTATS_TELEGRAM_REALTIME_ALERTS_ENABLED: ${RUSTATS_TELEGRAM_REALTIME_ALERTS_ENABLED:-true}
      # «Пульс»: дневные снапшоты + LLM-отчёт владельцу + кнопки бота (П9б)
      RUSTATS_PULSE_ENABLED: ${RUSTATS_PULSE_ENABLED:-false}
      RUSTATS_PULSE_CHAT_ID: ${RUSTATS_PULSE_CHAT_ID:-}
      RUSTATS_OPENROUTER_API_KEY: ${RUSTATS_OPENROUTER_API_KEY:-}
      RUSTATS_OPENROUTER_MODEL: ${RUSTATS_OPENROUTER_MODEL:-anthropic/claude-sonnet-5}
      RUSTATS_TELEGRAM_POLLER_ENABLED: ${RUSTATS_TELEGRAM_POLLER_ENABLED:-false}
      # Состояние (сессии/квоты) — отдельный Redis DB /1: FLUSHDB кэша не трогает.
      # Переезд на выделенный redis-state (О-8) — переопределением в .env.
      RUSTATS_STATE_REDIS_URL: ${RUSTATS_STATE_REDIS_URL:-redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1}
      # OLAP-слой ClickHouse (вкладка BI «Срезы»); выключается одной переменной,
      # сайт при выключенном/упавшем CH работает как раньше.
      RUSTATS_CLICKHOUSE_ENABLED: ${RUSTATS_CLICKHOUSE_ENABLED:-true}
      RUSTATS_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics_dev}
      # Расходы Директа: коннектор включается после передачи токена владельцем.
      RUSTATS_DIRECT_API_TOKEN: ${RUSTATS_DIRECT_API_TOKEN:-}
      TZ: Europe/Moscow
    volumes:
      - ./output:/app/data:ro
      # Гео-база DB-IP Lite: скачивается backend'ом при старте, обновляется
      # ежемесячным job'ом. Том — чтобы не тянуть ~100 МБ при каждом rebuild.
      - geoip_data:/app/geoip
      # П-16: дисковый кэш OG-картинок — переживает rebuild/рестарт
      - og_cache:/app/og-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-state:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # readiness (Н-1): БД + оба Redis + планировщик; 503 = unhealthy
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      # О-12: холодный старт = alembic + seed + региональный сидер (минуты);
      # при seed-hash-скипе — секунды. 240s покрывает худший случай без
      # флаппинга «unhealthy → frontend не стартует».
      start_period: 240s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    # OLAP-слой (ADR-0010): производная копия Postgres, «любая метрика × любое
    # измерение» для вкладки BI «Срезы». Ни одного нового пути записи: сайт и
    # сбор пишут только в Postgres; CH можно снести и налить заново ресинком
    # (docker compose exec backend python -c "...clickhouse_sync.resync()").
    # Порт только внутри docker-сети; том в бэкапы НЕ входит.
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics_dev}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Low-memory профиль: без него baseline CH съедает cgroup-лимит и любой
      # GROUP BY падает с MEMORY_LIMIT_EXCEEDED (code 241).
      - ./clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/low-memory-users.xml:/etc/clickhouse-server/users.d/low-memory.xml:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 700M
          cpus: '0.5'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  redis_state_data:
  geoip_data:
  og_cache:
  clickhouse_data:
