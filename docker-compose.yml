services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rustats
      POSTGRES_USER: rustats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rustats_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustats"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Прод-сервер резолвит api.telegram.org только в IPv6, а IPv6-маршрут до
    # Telegram у хостера мёртвый (ConnectTimeout) → уведомления и дайджест тихо
    # падали. Прибиваем имя к рабочему IPv4 Telegram API DC (стабильный годами).
    # Override через TELEGRAM_API_IP, если Telegram сменит IP. См. CONTEXT.md trap.
    extra_hosts:
      - "api.telegram.org:${TELEGRAM_API_IP:-149.154.167.220}"
    ports:
      - "127.0.0.1:8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    environment:
      RUSTATS_DATABASE_URL: postgresql+asyncpg://rustats:${POSTGRES_PASSWORD:-rustats_dev}@postgres:5432/rustats
      RUSTATS_REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      RUSTATS_ROSSTAT_CA_CERT: /app/certs/russiantrustedca2024.pem
      RUSTATS_SCHEDULER_ENABLED: "true"
      RUSTATS_ANALYTICS_ENABLED: ${RUSTATS_ANALYTICS_ENABLED:-false}
      RUSTATS_ANALYTICS_SCHEDULER_ENABLED: ${RUSTATS_ANALYTICS_SCHEDULER_ENABLED:-false}
      RUSTATS_ANALYTICS_API_TOKEN: ${RUSTATS_ANALYTICS_API_TOKEN:-}
      RUSTATS_ANALYTICS_ALLOWED_COUNTER_IDS: ${RUSTATS_ANALYTICS_ALLOWED_COUNTER_IDS:-107136069}
      RUSTATS_ANALYTICS_ALLOWED_HOSTS: ${RUSTATS_ANALYTICS_ALLOWED_HOSTS:-forecasteconomy.com}
      RUSTATS_ANALYTICS_LIVE_WRITES_ENABLED: ${RUSTATS_ANALYTICS_LIVE_WRITES_ENABLED:-false}
      RUSTATS_YANDEX_METRIKA_READ_TOKEN: ${RUSTATS_YANDEX_METRIKA_READ_TOKEN:-}
      RUSTATS_YANDEX_METRIKA_WRITE_TOKEN: ${RUSTATS_YANDEX_METRIKA_WRITE_TOKEN:-}
      RUSTATS_YANDEX_WEBMASTER_TOKEN: ${RUSTATS_YANDEX_WEBMASTER_TOKEN:-}
      RUSTATS_DEBUG: ${RUSTATS_DEBUG:-false}
      # Личный кабинет (ADR-0007). fake-провайдер и debug по умолчанию off (prod-safe);
      # для локального E2E включаются явно через .env / переменные окружения.
      RUSTATS_AUTH_COOKIE_SECURE: ${RUSTATS_AUTH_COOKIE_SECURE:-false}
      RUSTATS_AUTH_PUBLIC_BASE_URL: ${RUSTATS_AUTH_PUBLIC_BASE_URL:-http://localhost:3000}
      RUSTATS_AUTH_FAKE_PROVIDER_ENABLED: ${RUSTATS_AUTH_FAKE_PROVIDER_ENABLED:-false}
      RUSTATS_OAUTH_YANDEX_CLIENT_ID: ${RUSTATS_OAUTH_YANDEX_CLIENT_ID:-}
      RUSTATS_OAUTH_YANDEX_CLIENT_SECRET: ${RUSTATS_OAUTH_YANDEX_CLIENT_SECRET:-}
      RUSTATS_OAUTH_YANDEX_SCOPE: ${RUSTATS_OAUTH_YANDEX_SCOPE:-}
      RUSTATS_OAUTH_YANDEX_REDIRECT_URI: ${RUSTATS_OAUTH_YANDEX_REDIRECT_URI:-}
      RUSTATS_OAUTH_VK_CLIENT_ID: ${RUSTATS_OAUTH_VK_CLIENT_ID:-}
      RUSTATS_OAUTH_VK_CLIENT_SECRET: ${RUSTATS_OAUTH_VK_CLIENT_SECRET:-}
      RUSTATS_OAUTH_VK_SERVICE_KEY: ${RUSTATS_OAUTH_VK_SERVICE_KEY:-}
      RUSTATS_OAUTH_VK_SCOPE: ${RUSTATS_OAUTH_VK_SCOPE:-}
      RUSTATS_OAUTH_VK_REDIRECT_URI: ${RUSTATS_OAUTH_VK_REDIRECT_URI:-}
      RUSTATS_DOWNLOAD_ANON_LIMIT: ${RUSTATS_DOWNLOAD_ANON_LIMIT:-0}
      RUSTATS_DOWNLOAD_ANON_HISTORY_YEARS: ${RUSTATS_DOWNLOAD_ANON_HISTORY_YEARS:-3}
      # Telegram-бот: уведомления о регистрациях + ежедневный дайджест
      RUSTATS_TELEGRAM_BOT_TOKEN: ${RUSTATS_TELEGRAM_BOT_TOKEN:-}
      RUSTATS_TELEGRAM_CHAT_ID: ${RUSTATS_TELEGRAM_CHAT_ID:-}
      RUSTATS_TELEGRAM_DIGEST_ENABLED: ${RUSTATS_TELEGRAM_DIGEST_ENABLED:-false}
      RUSTATS_TELEGRAM_DIGEST_CHAT_IDS: ${RUSTATS_TELEGRAM_DIGEST_CHAT_IDS:-}
      RUSTATS_TELEGRAM_REALTIME_ALERTS_ENABLED: ${RUSTATS_TELEGRAM_REALTIME_ALERTS_ENABLED:-true}
      TZ: Europe/Moscow
    volumes:
      - ./output:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
